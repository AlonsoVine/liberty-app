name: Build macOS

# Construye «Liberty.app» como un ÚNICO binario UNIVERSAL2 (Apple Silicon arm64 + Intel
# x86_64 en el mismo ejecutable) en el runner macos-14 (que sí tiene disponibilidad, al
# contrario que los macos-13 de Intel) y lo publica como un solo .dmg:
#     Liberty-macOS.dmg      (universal2: funciona nativo en M1/M2/M3… y en Intel)
#
# Un .dmg es la forma estándar y limpia en Mac: doble clic → se monta → aparece Liberty.app
# y un acceso a «Aplicaciones» para arrastrarlo (nada de carpetas sueltas ni __MACOSX).
#
# POR QUÉ UNIVERSAL2: un binario arm64 NO arranca en Intel, y uno x86_64 va en Apple Silicon
# solo por Rosetta (lento). universal2 lleva ambas arquitecturas → una única descarga para
# todos los Mac, nativa en cada uno. Necesita un Python universal2 (instalador de python.org,
# no el de setup-python, que es de una sola arquitectura) y que toda extensión C sea también
# universal2 (aquí solo markupsafe._speedups, que compilamos desde fuente con ARCHFLAGS).
#
# La app va FIRMADA «ad-hoc» (codesign --sign -): no es una firma de pago de Apple, pero evita
# el error «la aplicación está dañada». Al no estar notarizada, la primera vez se abre con
# clic derecho → Abrir (o Ajustes del Sistema → Privacidad y seguridad → «Abrir de todos modos»).
#
# OJO: el código vive en este repo (liberty-app) pero las Releases se publican en el repo de
# distribución (AlonsoVine/liberty). Se lanza A MANO indicando el tag de la release ya creada.
#
# Cómo usarlo:
#   1. Publica la release en AlonsoVine/liberty con el Liberty.exe (como siempre).
#   2. Actions -> «Build macOS» -> Run workflow -> escribe el tag (p. ej. v1.15.0).
#   3. El .dmg universal se compila y:
#        - si existe el secreto LIBERTY_RELEASE_TOKEN (PAT con escritura en AlonsoVine/liberty),
#          se sube solo a esa release;
#        - en cualquier caso, queda como ARTEFACTO del run para subirlo a mano.
#
# CONTADOR DE DESCARGAS: cada versión = release nueva; nombre de asset EXACTO
# «Liberty-macOS.dmg»; NO re-subir encima de uno ya publicado (se perdería su contador).
# La landing suma también los assets antiguos (Liberty-macOS.zip, -AppleSilicon.dmg, -Intel.dmg).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release en AlonsoVine/liberty (p. ej. v1.15.0)"
        required: true

env:
  PYVER: "3.12.7"                       # versión del instalador universal2 de python.org
  ARCHFLAGS: "-arch x86_64 -arch arm64" # compila cualquier extensión C como universal2

jobs:
  build-mac:
    runs-on: macos-14                   # Apple Silicon, con Python universal2 de python.org
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python universal2 (python.org)
        run: |
          set -euxo pipefail
          PKG="python-${PYVER}-macos11.pkg"   # el .pkg «macos11» de python.org es universal2
          curl -fsSL -o "$PKG" "https://www.python.org/ftp/python/${PYVER}/${PKG}"
          sudo installer -pkg "$PKG" -target /
          PYBIN="/Library/Frameworks/Python.framework/Versions/3.12/bin/python3"
          "$PYBIN" -c "import platform,sys;print('python', sys.version)"
          # Debe listar las dos arquitecturas del propio intérprete:
          lipo -archs "/Library/Frameworks/Python.framework/Versions/3.12/Python" || true
          echo "PYBIN=$PYBIN" >> "$GITHUB_ENV"

      - name: Crear entorno e instalar dependencias (universal2)
        run: |
          set -euxo pipefail
          "$PYBIN" -m venv .venvmac
          source .venvmac/bin/activate
          python -m pip install --upgrade pip
          # markupsafe trae una extensión C (_speedups): la compilamos desde fuente para que
          # salga universal2 (ARCHFLAGS). El resto de dependencias son Python puro.
          pip install --no-binary=markupsafe "markupsafe"
          pip install flask openpyxl pyinstaller
          # Verifica que la extensión compilada es efectivamente universal2.
          SO=$(python -c "import markupsafe._speedups as m;print(m.__file__)")
          echo "markupsafe speedups: $SO"
          lipo -archs "$SO"
          lipo -archs "$SO" | grep -q "x86_64" && lipo -archs "$SO" | grep -q "arm64" \
            && echo "markupsafe._speedups universal2 OK"

      - name: Generar el icono (.icns)
        run: |
          set -euxo pipefail
          SRC=app/web/icono-512.png
          mkdir -p Liberty.iconset build
          sips -z 16 16     "$SRC" --out Liberty.iconset/icon_16x16.png
          sips -z 32 32     "$SRC" --out Liberty.iconset/icon_16x16@2x.png
          sips -z 32 32     "$SRC" --out Liberty.iconset/icon_32x32.png
          sips -z 64 64     "$SRC" --out Liberty.iconset/icon_32x32@2x.png
          sips -z 128 128   "$SRC" --out Liberty.iconset/icon_128x128.png
          sips -z 256 256   "$SRC" --out Liberty.iconset/icon_128x128@2x.png
          sips -z 256 256   "$SRC" --out Liberty.iconset/icon_256x256.png
          sips -z 512 512   "$SRC" --out Liberty.iconset/icon_256x256@2x.png
          cp "$SRC" Liberty.iconset/icon_512x512.png
          iconutil -c icns Liberty.iconset -o build/Liberty.icns

      - name: Compilar Liberty.app (universal2)
        env:
          LIBERTY_TARGET_ARCH: universal2   # lo lee Liberty-mac.spec (target_arch del EXE)
        run: |
          set -euxo pipefail
          source .venvmac/bin/activate
          pyinstaller Liberty-mac.spec --noconfirm --clean
          # Confirma que el ejecutable final lleva las dos arquitecturas.
          lipo -archs dist/Liberty.app/Contents/MacOS/Liberty
          lipo -archs dist/Liberty.app/Contents/MacOS/Liberty | grep -q "x86_64" \
            && lipo -archs dist/Liberty.app/Contents/MacOS/Liberty | grep -q "arm64" \
            && echo "Liberty universal2 OK"

      - name: Firmar ad-hoc (evita el error «app dañada»)
        run: |
          set -euxo pipefail
          xattr -cr dist/Liberty.app || true
          codesign --force --deep --sign - dist/Liberty.app
          codesign --verify --deep --strict dist/Liberty.app && echo "firma ad-hoc OK"

      - name: Comprobar que arranca (smoke test)
        run: |
          set -euxo pipefail
          PATRIMONIO_NO_ABRIR=1 PATRIMONIO_PUERTO=8799 ./dist/Liberty.app/Contents/MacOS/Liberty &
          PID=$!
          sleep 8
          curl -fsS -o /dev/null "http://127.0.0.1:8799/" && echo "home OK"
          curl -fsS "http://127.0.0.1:8799/api/version" | grep -o '"actual":"[^"]*"'
          kill $PID 2>/dev/null || true

      - name: Empaquetar en .dmg (arrastra a Aplicaciones)
        run: |
          set -euxo pipefail
          mkdir -p dmgroot
          cp -R dist/Liberty.app dmgroot/
          ln -s /Applications dmgroot/Applications
          DMG="Liberty-macOS.dmg"
          hdiutil create -volname "Liberty" -srcfolder dmgroot -ov -format UDZO "$DMG"
          ls -lh "$DMG"

      - name: Artefacto de respaldo (siempre)
        uses: actions/upload-artifact@v4
        with:
          name: Liberty-macOS
          path: Liberty-macOS.dmg

      - name: Subir a la Release de AlonsoVine/liberty (si hay token)
        env:
          GH_TOKEN: ${{ secrets.LIBERTY_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No hay secreto LIBERTY_RELEASE_TOKEN. Descarga el artefacto 'Liberty-macOS' y súbelo a mano a la release."
            exit 0
          fi
          gh release upload "${{ github.event.inputs.tag }}" "Liberty-macOS.dmg" -R AlonsoVine/liberty
